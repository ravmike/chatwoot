name: Focused external routing lint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin-validator-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop for corrected origin validator
        run: bundle exec rubocop lib/chatwoot/configured_origin.rb
